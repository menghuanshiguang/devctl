name: ui-overlay

on:
  push:
    branches: [main]
    paths: ["ui/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: download build-tools (d8)
        run: |
          curl -sL -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r35-linux.zip
          unzip -q /tmp/bt.zip -d /tmp/bt
          ls /tmp/bt/
      - name: javac + d8
        run: |
          mkdir -p /tmp/out /tmp/dex
          javac -source 8 -target 8 -d /tmp/out ui/DevctlUI.java
          BT=$(ls -d /tmp/bt/android-1* | head -1)
          "$BT/d8" --min-api 26 --output /tmp/dex /tmp/out/DevctlUI.class
          ls -la /tmp/dex/
      - uses: actions/upload-artifact@v4
        with:
          name: devctl-ui
          path: /tmp/dex/classes.dex
