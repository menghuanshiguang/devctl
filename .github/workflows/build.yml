name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build agent (android arm64)
        working-directory: agent
        run: |
          mkdir -p ../release
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags "-s -w" -o ../release/agent .
      - name: package magisk module (agent 内嵌全部 ui 载荷)
        run: |
          cd magisk
          cp ../release/agent ./agent
          chmod 755 agent service.sh
          zip -r ../release/devctl-android.zip module.prop service.sh agent
      - name: stage android assets (文件名标注 Magisk 模块 + 版本号)
        run: |
          mkdir -p release/stage
          VER=${GITHUB_REF_NAME}
          cp release/devctl-android.zip "release/stage/devctl-magisk-${VER}.zip"
          cp release/agent "release/stage/devctl-agent-android-arm64-${VER}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/stage
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build agent (windows amd64)
        working-directory: agent
        run: |
          mkdir -p ../release
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o ../release/agent-windows.exe .
      - name: package windows zip (exe + 安装脚本, 解压即用)
        run: |
          VER=${GITHUB_REF_NAME}
          mkdir -p release/win-stage
          cp release/agent-windows.exe release/win-stage/
          cp win/install-local.ps1 release/win-stage/
          cd release/win-stage
          zip -r "../devctl-windows-${VER}.zip" agent-windows.exe install-local.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/devctl-windows-*.zip
          if-no-files-found: error

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package client zip (devctl.py + 快捷入口 + 说明, 解压即用)
        run: |
          VER=${GITHUB_REF_NAME}
          mkdir -p release/client-stage
          cp client/devctl.py release/client-stage/
          cp client/devctl.bat release/client-stage/
          cp client/README-client.md release/client-stage/README.md
          chmod +x release/client-stage/devctl.py
          cd release/client-stage
          zip -r "../devctl-client-${VER}.zip" devctl.py devctl.bat README.md
      - uses: actions/upload-artifact@v4
        with:
          name: client-release
          path: release/devctl-client-*.zip
          if-no-files-found: error

  release:
    needs: [android, windows, client]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: stage
        run: |
          mkdir -p stage
          find artifacts -type f -exec cp {} stage/ \;
          ls -la stage
      - uses: softprops/action-gh-release@v2
        with:
          files: stage/*
