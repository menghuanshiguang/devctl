name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build agent (android arm64)
        working-directory: agent
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags "-s -w" -o ../release/agent .
      - name: package magisk module
        run: |
          cd magisk
          cp ../release/agent ./agent
          chmod 755 agent service.sh
          zip -r ../release/devctl-android.zip module.prop service.sh agent
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/devctl-android.zip
            release/agent-windows.exe
